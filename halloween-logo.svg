<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340">
  <defs>
    <linearGradient id="hlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FF4A1C"/>
      <stop offset="100%" stop-color="#C41C00"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF385"/>
      <stop offset="100%" stop-color="#FFA41C"/>
    </linearGradient>
    <filter id="spookyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Pumpkin body with angular esports cuts -->
  <path d="M200 40 L235 15 L245 42 Q285 45 320 80 Q365 130 365 200 Q365 285 285 315 Q245 325 200 325 Q155 325 115 315 Q35 285 35 200 Q35 130 80 80 Q115 45 155 42 L165 15 Z" fill="#131313" stroke="url(#hlGrad)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Segments / ribs with glowing orange cuts -->
  <path d="M200 45 Q130 110 130 200 Q130 290 200 320" fill="none" stroke="url(#hlGrad)" stroke-width="4" stroke-dasharray="14 8" opacity="0.4"/>
  <path d="M200 45 Q270 110 270 200 Q270 290 200 320" fill="none" stroke="url(#hlGrad)" stroke-width="4" stroke-dasharray="14 8" opacity="0.4"/>

  <!-- Stem / Fox crest at top -->
  <polygon points="188,40 212,40 220,10 196,15" fill="#FF4A1C"/>

  <!-- Left Fox / Bat Ear -->
  <polygon points="85,85 45,15 125,50" fill="url(#hlGrad)" stroke="#000" stroke-width="4"/>
  <polygon points="82,75 58,30 110,55" fill="#000"/>

  <!-- Right Fox / Bat Ear -->
  <polygon points="315,85 355,15 275,50" fill="url(#hlGrad)" stroke="#000" stroke-width="4"/>
  <polygon points="318,75 342,30 290,55" fill="#000"/>

  <!-- Sharp Spooky Eyes with Glow -->
  <!-- Left Eye -->
  <polygon points="105,140 165,160 145,185 100,165" fill="url(#eyeGlow)" filter="url(#spookyGlow)"/>
  <!-- Right Eye -->
  <polygon points="295,140 235,160 255,185 300,165" fill="url(#eyeGlow)" filter="url(#spookyGlow)"/>

  <!-- Nose (Inverted sharp triangle) -->
  <polygon points="200,180 185,210 215,210" fill="url(#eyeGlow)"/>

  <!-- Menacing Carved Esports Mouth / Teeth -->
  <path d="M100 225 L135 240 L150 228 L170 248 L185 230 L200 250 L215 230 L230 248 L250 228 L265 240 L300 225 L285 265 L260 255 L245 280 L225 260 L200 285 L175 260 L155 280 L140 255 L115 265 Z" fill="url(#eyeGlow)" filter="url(#spookyGlow)"/>

  <!-- Accent sparks -->
  <circle cx="90" cy="110" r="3" fill="#FF6B35" opacity="0.8"/>
  <circle cx="310" cy="110" r="3" fill="#FF6B35" opacity="0.8"/>
</svg>